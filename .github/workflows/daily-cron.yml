# Calls the app's daily lifecycle job (trial / renewal reminder e-mails,
# moving lapsed accounts to the Free plan). Cloudflare Pages has no cron,
# so GitHub Actions triggers it.
#
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#   APP_URL      https://gst-billing-pro.pages.dev   (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var in Cloudflare Pages
name: daily-cron

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC = 08:00 IST
  workflow_dispatch: {}

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/daily
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL / CRON_SECRET secrets are not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/daily")
          cat response.json; echo
          if [ "$code" != "200" ]; then echo "::error::cron returned HTTP $code"; exit 1; fi
