<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
<title>GST Billing Pro — offline</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#F8FAFC;color:#0f172a;font-family:Segoe UI,system-ui,sans-serif}
  .card{max-width:440px;margin:1rem;padding:2rem;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(15,23,42,.12);text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:1.4rem;margin:1rem 0 .5rem}
  p{color:#475569;line-height:1.5;margin:0 0 1.25rem}
  button{font:inherit;font-weight:600;padding:.75rem 1.5rem;border:0;border-radius:10px;background:#1E40AF;color:#fff;cursor:pointer}
  small{display:block;margin-top:1rem;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <img src="icon.png" alt="">
  <h1>You're offline</h1>
  <p>GST Billing Pro couldn't reach the internet. Check your Wi-Fi or network cable, then try again. Your data is safe.</p>
  <button id="retry" type="button">Try again</button>
  <small>Retrying automatically every 15 seconds…</small>
</div>
<script>
  const target = new URLSearchParams(location.search).get('url') || 'https://gst-billing-pro.pages.dev/';
  const go = () => { location.href = target; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
  setInterval(() => { if (navigator.onLine) go(); }, 15000);
</script>
</body>
</html>
